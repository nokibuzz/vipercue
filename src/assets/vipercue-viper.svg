<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ViperCue striking viper head</title>
  <desc id="desc">A close-up angular viper head with an amber glare, open jaws, and long fangs.</desc>
  <defs>
    <radialGradient id="back" cx=".72" cy=".32" r=".9"><stop stop-color="#1b4b35"/><stop offset=".66" stop-color="#071b15"/><stop offset="1" stop-color="#06100d"/></radialGradient>
    <linearGradient id="skin" x1="0" y1=".95" x2="1" y2=".08"><stop stop-color="#08704f"/><stop offset=".48" stop-color="#2dcb78"/><stop offset="1" stop-color="#a6f784"/></linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0ff91"/><stop offset=".45" stop-color="#71e690"/><stop offset="1" stop-color="#178d5a"/></linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#210f1a"/><stop offset="1" stop-color="#8f2a35"/></linearGradient>
  </defs>
  <style>
    #strike{transform-origin:255px 257px;animation:lunge 3.4s ease-in-out infinite}
    #tongue{transform-origin:453px 303px;animation:flick 3.4s steps(2,end) infinite}
    #glare{animation:glint 3.4s ease-in-out infinite}
    @keyframes lunge{0%,100%{transform:translateX(0)}46%{transform:translateX(-7px)}58%{transform:translateX(7px)}}
    @keyframes flick{0%,40%,70%,100%{opacity:0}43%,66%{opacity:1}}
    @keyframes glint{0%,100%{opacity:1}50%{opacity:.72}}
  </style>
